services:
  db:
    image: postgres:17-alpine
    container_name: fitflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: fitflow_dev
    ports:
      # Porta incomum para não colidir com PostgreSQL locais já instalados.
      - "127.0.0.1:54329:5432"
    volumes:
      - fitflow-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitflow -d fitflow_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitflow-pgdata:
